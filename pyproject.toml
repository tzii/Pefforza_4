[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pefforza"
version = "0.5.0"
description = "Connect 4 AI with computer vision, voice, and a PPO agent (Pefforza)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Pefforza contributors" }]
keywords = ["connect4", "reinforcement-learning", "computer-vision", "ppo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment :: Board Games",
]

# Runtime deps mirror requirements.txt; lower bounds chosen to match what we
# develop and test against, upper bounds are open to keep installs flexible.
# Pin upper bounds tighter only if upstream regressions appear.
dependencies = [
    "gymnasium>=1.0,<2",
    "stable-baselines3>=2.3,<3",
    "tensorboard>=2.9.1,<3",
    "matplotlib>=3.7,<4",
    "shimmy>=1.3,<3",
    "numpy>=1.26,<3",
    "opencv-python>=4.8,<5",
    "pygame>=2.5,<3",
    "pyttsx3>=2.90",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "ruff>=0.6,<1",
    "mypy>=1.10,<3",
]

[project.scripts]
pefforza-cli = "pefforza.cli.play_cli:main"
pefforza-gui = "pefforza.cli.play_gui:main"
pefforza-physical = "pefforza.cli.play_physical:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pefforza*"]
exclude = ["tests*", "notebooks*", ".kilo*", ".venv*"]

# Ship the bundled PPO checkpoint so the `neural` difficulty tier works from a
# wheel install, not just from a source checkout. Verified by the wheel smoke
# test job in CI.
[tool.setuptools.package-data]
pefforza = ["agent/models/*.zip"]

# ----------------- Tooling -----------------

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = [
    # pyttsx3/pygame pull in deprecated pkg_resources; downgrade to default.
    "default::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "notebooks", ".kilo"]

[tool.ruff.lint]
# Curated, low-noise set: pyflakes, pycodestyle, isort, bugbear, simplify,
# comprehensions, naming, pyupgrade. Avoids style-only churn.
select = ["E", "F", "W", "I", "B", "C4", "N", "SIM", "UP"]
ignore = [
    # Allow `from x import *` in __init__-like surfaces (we don't actually use it,
    # but keep the door open without noise).
    "F403",
    # `assert` is fine in tests and rare runtime guards.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N806"]  # tests can use camelCase if needed

# ----------------- Type checking -----------------

[tool.mypy]
# No pinned python_version: each interpreter (3.10-3.13 in CI) checks its own
# syntax level. Pinning to the floor breaks on numpy>=2.3 stubs, which use
# PEP 695 `type` statements that only parse for 3.12+ targets.
files = ["pefforza"]
# Pragmatic settings for a project that depends on heavy ML / CV libraries
# without complete type stubs. We don't want mypy to fail on every external
# untyped call — we want it to catch real bugs in *our* code.
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true
# Tighten our own modules; leave third-party shims relaxed.
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pefforza.rules", "pefforza.constants", "pefforza.envs.*"]
disallow_untyped_defs = true
